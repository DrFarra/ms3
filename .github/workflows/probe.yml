name: Site probe

# Downloads real responses from farmatotal.com.py so the app's parsing can be checked against live data.
on:
  pull_request:
    paths: [.github/workflows/probe.yml, FarmatotalApp/probe.sh]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash FarmatotalApp/probe.sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-probe
          path: out
