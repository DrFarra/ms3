name: Farmatotal
options:
  bundleIdPrefix: py.com.farmatotal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Farmatotal:
    type: application
    platform: iOS
    sources: [Farmatotal]
    info:
      path: Farmatotal/Info.plist
      properties:
        CFBundleDisplayName: Farmatotal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Para escanear el código de barras de un producto y buscarlo.
        NSMicrophoneUsageDescription: Para buscar productos hablando.
        NSSpeechRecognitionUsageDescription: Para convertir tu voz en una búsqueda de productos.
        NSLocationWhenInUseUsageDescription: Para mostrarte la sucursal de Farmatotal más cercana.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: py.com.farmatotal.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  FarmatotalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FarmatotalTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Farmatotal
schemes:
  Farmatotal:
    build:
      targets:
        Farmatotal: all
    test:
      targets: [FarmatotalTests]
